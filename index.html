<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AsusVisualDisplay | Premium Portal</title>
    
    <link rel="icon" type="image/png" href="asus_logo.png">
    
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="bg-lines-container">
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
    </div>

    <div class="beams-container">
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="grid-overlay"></div>
    </div>

    <header class="navbar-container">
        <div class="navbar-glass">
            <div class="logo" onclick="location.reload()" style="cursor:pointer;">🚜 AsusVisualDisplay</div>
            
            <div class="nav-search-container" id="navSearchWrapper">
                <input type="text" id="modelSearch" placeholder="🔍 Buscar modelo...">
            </div>

            <nav class="nav-links">
                <a href="#" onclick="location.reload()">Inicio</a>
                <a href="#" onclick="openRequestForm()">Pedir Wallpaper</a>
                <a href="https://drive.google.com/drive/folders/14QSkljqCOANOvYIFDsQT5ZPr-527exn1" target="_blank">Drive</a>
            </nav>
        </div>
    </header>

    <main class="hero-section" id="hero-main">
        <div class="hero-content-wrapper">
            <p class="badge-msg">Portal de Contenidos</p>
            <h1 class="hero-title">In Search <br><span>of Incredible.</span></h1>

            <div class="hero-buttons">
                <button class="btn-outline" onclick="showSection('wallpapers')">Wallpapers</button>
                <button class="btn-outline" onclick="showSection('demos')">Demos</button>
                <button class="btn-outline" onclick="showSection('manuales')">Manuales</button>
            </div>
        </div>
    </main>

    <section id="request-section" class="request-container" style="display: none;">
        <div class="form-card">
            <h2>Solicitar Nuevo Wallpaper</h2>
            <p>¿No encuentras el modelo industrial o ficha que buscas? Pídelo aquí.</p>
            
            <form action="https://formsubmit.co/asus.martin.elizalde@gmail.com" method="POST">
                <div class="input-group">
                    <label for="form-name">Tu Nombre</label>
                    <input type="text" id="form-name" name="name" placeholder="Ej. Juan Pérez" required>
                </div>
                
                <div class="input-group">
                    <label for="form-model">Modelo de Equipo / Serie</label>
                    <input type="text" id="form-model" name="model" placeholder="Ej. ASUS AiO A5 A5702WVA" required>
                </div>
                
                <div class="input-group">
                    <label for="form-details">Detalles Específicos (Opcional)</label>
                    <textarea id="form-details" name="comments" rows="3" placeholder="Ej. Resolución 4K, ficha técnica con Intel i7..."></textarea>
                </div>

                <input type="hidden" name="_captcha" value="false">
                <input type="hidden" name="_next" value="https://asusvisualdisplay.github.io/">

                <div class="form-buttons">
                    <button type="submit" class="btn-submit">Enviar Solicitud</button>
                    <button type="button" class="btn-cancel" onclick="location.reload()">Cancelar</button>
                </div>
            </form>
        </div>
    </section>

    <div id="zip-button-container" class="download-all-container"></div>

    <div class="gallery-container" id="gallery"></div>

    <footer>
        <p>© 2026 AsusVisualDisplay | Gestión de Activos Digitales | 🚜</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
